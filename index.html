<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spinner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="color-modal" class="hidden">
        <div class="color-picker-card">
            <div class="hex-row">
                <input type="color" id="native-picker" value="#2196f3">
                <input type="text" id="hex-input" value="#2196F3" maxlength="7" spellcheck="false" autocomplete="off">
            </div>
            <div id="palette-grid" class="palette-grid"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
